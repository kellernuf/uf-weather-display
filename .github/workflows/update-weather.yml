      - name: Build 30 minute radar loop
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          mkdir -p radar
          rm -f radar/*.png radar/radar-loop.gif

          python3 <<'PY'
          from datetime import datetime, timedelta, timezone
          import subprocess
          import os

          now = datetime.now(timezone.utc)

          # Round down to the most recent 5-minute interval.
          now = now.replace(
              minute=(now.minute // 5) * 5,
              second=0,
              microsecond=0
          )

          frames = []

          # 30 minutes ago through now
          for minutes_ago in range(30, -1, -5):

              frame_time = now - timedelta(
                  minutes=minutes_ago
              )

              timestamp = frame_time.strftime(
                  "%Y%m%d%H%M"
              )

              filename = (
                  f"radar/frame-{minutes_ago:02d}.png"
              )

              url = (
                  "https://mesonet.agron.iastate.edu/"
                  "GIS/radmap.php"
                  "?width=1200"
                  "&height=850"
                  "&bbox=-85.0,27.4,-80.2,31.6"
                  "&layers[]=uscounties"
                  "&layers[]=nexrad"
                  "&layers[]=sbw"
                  "&layers[]=places"
                  "&layers[]=interstates"
                  "&layers[]=legend"
                  f"&ts={timestamp}"
              )

              print(
                  f"Downloading radar "
                  f"{minutes_ago} minutes ago..."
              )

              subprocess.run(
                  [
                      "curl",
                      "--fail",
                      "--retry", "3",
                      "-L",
                      url,
                      "-o",
                      filename
                  ],
                  check=True
              )

              frames.append(filename)

          # Make NOW linger longer than previous frames.
          gif_inputs = []

          for frame in frames[:-1]:
              gif_inputs.extend([
                  "-delay", "75",
                  frame
              ])

          gif_inputs.extend([
              "-delay", "200",
              frames[-1]
          ])

          command = [
              "convert",
              *gif_inputs,
              "-loop", "0",
              "radar/radar-loop.gif"
          ]

          subprocess.run(
              command,
              check=True
          )

          with open(
              "radar/updated.txt",
              "w"
          ) as f:
              f.write(
                  now.strftime(
                      "%Y-%m-%dT%H:%M:%SZ"
                  )
              )

          PY
